}. От них считывается вся форма.</p></div><div class="card"><strong>02 / Добавь 3 и 5</strong><p>${E.chordNotes(caged.root)[1]} — большая терция, ${E.chordNotes(caged.root)[2]} — чистая квинта.</p></div><div class="card"><strong>03 / Соедини позиции</strong><p>Переключи форму. Аккорд тот же, место другое.</p></div></div><div class="row between wrap"><button class="btn secondary" data-action="caged-play">${ic('sound','sm')}Слушать арпеджио</button><button class="btn" data-action="practice-caged">Проверить себя ${ic('arrow','sm')}</button></div><div class="note-callout" style="margin-top:20px">${caged.shape==='G'?'Полная G-форма — карта для изучения, а не обязательный хват целиком. Играй фрагменты на 3–4 струнах.':caged.shape==='A'?'Ноты на соседних струнах можно зажать малым баррэ. Это один из вариантов аппликатуры.':'Найди основные тоны, назови трезвучие и попробуй ту же форму в другом аккорде.'}</div>`}
function progressPage(){const all=state.sessions.filter(s=>s.instrument===state.instrument),ss=all.filter(s=>!s.legacy&&(s.input||'screen')===progressInput),answers=ss.flatMap(s=>s.answers||[]),rate=answers.length?Math.round(100*answers.filter(a=>a.first).length/answers.length):null,time=ss.reduce((n,s)=>n+(s.seconds||0),0);const cells={};if(progressInput==='screen')for(const a of answers)for(const p of a.positions||[]){let k=p.s+':'+p.f;cells[k]||={seen:0,first:0};cells[k].seen++;cells[k].first+=a.first?1:0}const max=Object.keys(cells).some(k=>Number(k.split(':')[1])>12)?24:12;const modeStats=Object.keys(E.MODES).map(mode=>{let rows=answers.filter(a=>a.mode===mode);return{mode,n:rows.length,rate:rows.length?Math.round(100*rows.filter(a=>a.first).length/rows.length):null}}).filter(x=>x.n);
return `${heading('Навык, который остаётся','Ты уже <span class="serif">ближе.</span>','Только твои занятия. Каждый инструмент и способ проверки учитываются отдельно.')}<div class="progress-filters"><div class="pill-switch">${[['screen','На экране'],['sound','С инструментом']].map(([id,n])=>`<button class="${progressInput===id?'active':''}" data-action="progress-input" data-value="${id}">${n}</button>`).join('')}</div></div><div class="stat-grid" style="margin-top:0"><div class="stat"><strong>${ss.length}</strong><span>завершённых занятий</span></div><div class="stat"><strong>${rate===null?'—':rate+'%'}</strong><span>без ошибок и подсказок</span></div><div class="stat"><strong>${Math.floor(time/60)}</strong><span>минут практики</span></div></div><div class="progress-grid"><section class="card"><div class="section-head"><h2>${progressInput==='screen'?'Знакомые территории':'Высота звука'}</h2><span class="tag">${inst().short}</span></div>${progressInput==='screen'?`<p class="small muted">Точность на проверенных позициях. Пустая ячейка — ещё не проверяли. Нажми на ячейку, чтобы повторить.</p><div class="heat-scroll"><div class="heatmap" style="min-width:${max>12?'560':'320'}px;grid-template-columns:20px repeat(${max+1},1fr)"><div></div>${Array.from({length:max+1},(_,f)=>`<div class="heat-label">${f}</div>`).join('')}${inst().names.map((n,s)=>`<div class="heat-label">${n}</div>${Array.from({length:max+1},(_,f)=>{let c=cells[s+':'+f],v=c?Math.max(1,Math.ceil(c.first/c.seen*4)):0;return`<button class="heat-cell level${v}" data-action="practice-cell" data-string="${s}" data-fret="${f}" aria-label="${n}, лад ${f}: ${c?c.first+' из '+c.seen+' без помощи':'ещё не проверяли'}"></button>`}).join('')}`).join('')}</div></div><div class="row between small muted" style="font-size:10px"><span>Ещё исследуем</span><span class="row" style="gap:4px">${[0,1,2,3,4].map(i=>`<i class="heat-cell level${i}" style="height:10px;width:18px"></i>`).join('')}</span><span>Уверенно</span></div>`:'<p class="small muted">Микрофон проверяет ноту и октаву. Он не позволяет определить струну, лад или палец, поэтому карта грифа по звуку не заполняется.</p>'}<div class="rule"></div><div class="row between wrap"><div><h3 style="font-size:14px">Повторение</h3><p class="small muted" style="margin-top:6px">К повторению: ${dueCards(progressInput).length}</p></div><button class="btn secondary compact" data-action="review" data-input="${progressInput}" ${!dueCards(progressInput).length?'disabled':''}>Закрепить ${ic('arrow','sm')}</button></div></section><section class="card"><div class="section-head"><h2>Навыки в практике</h2></div>${modeStats.length?modeStats.map(x=>`<div class="skill-row"><div class="row between"><span>${E.MODES[x.mode].name}</span><strong>${x.rate}%</strong></div><div class="progress-track"><span style="width:${x.rate}%"></span></div><p class="small muted" style="margin-top:5px;font-size:10px">Проверок: ${x.n}</p></div>`).join(''):'<p class="no-data">Первое занятие даст точку отсчёта.</p>'}</section><section class="card"><div class="section-head"><h2>Последние семь дней</h2><span class="tag">Все инструменты</span></div><div class="chart">${weekDays().map(d=>{let v=d.seconds/60,maxM=Math.max(10,...weekDays().map(w=>w.seconds/60));return`<div class="chart-day"><span>${v?Math.round(v*10)/10:''}</span><div class="bar ${d.today?'current':''}" style="height:${Math.max(4,v/maxM*90)}px"></div><span>${d.label}</span></div>`}).join('')}</div><p class="small muted" style="margin-top:17px">Серия дней: ${E.streak(state.sessions)} · учитываем местную дату</p></section><section class="card"><div class="section-head"><h2>История занятий</h2></div>${ss.length?ss.slice(-8).reverse().map(s=>`<div class="session-item"><span class="step-num done">✓</span><div class="grow"><strong class="small">${esc(s.label||'Практика')}</strong><p>${new Date(s.date).toLocaleDateString('ru-RU')} · Заданий: ${s.total} · ${seconds(s.seconds||0)}</p></div><strong class="small">${s.rate}%</strong></div>`).join(''):'<p class="no-data">Здесь появится первое завершённое занятие.</p><button class="btn secondary wide" data-go="practice">Начать практику</button>'}${all.some(s=>s.legacy)?`<div class="rule"></div><p class="small muted">Сохранено ${all.filter(s=>s.legacy).length} занятий из прототипа. Они не включены в карту навыков: в старой версии не было подробных ответов.</p>`:''}</section></div>`}

function settingsPage(){return `${heading('Подстроить под себя','Твой инструмент.<br><span class="serif">Твой ритм.</span>','Настройки, резервная копия и удобный старт.')}<div class="settings-grid"><section class="card"><h2>Практика</h2><div class="form-grid"><div class="field span2"><label for="settings-instrument">Инструмент · стандартный строй</label><select id="settings-instrument" data-setting="instrument">${options(Object.keys(instruments),state.instrument,v=>instruments[v].short)}</select></div><div class="field span2"><label for="settings-goal">Главная цель</label><select id="settings-goal" data-setting="goal">${options(['navigate','harmony','freedom'],state.goal,v=>({navigate:'Свободно находить ноты',harmony:'Понимать аккорды и интервалы',freedom:'Играть по всему грифу'})[v])}</select></div><div class="field"><label for="settings-level">Уровень</label><select id="settings-level" data-setting="level">${options(['new','some','confident'],state.level,v=>({new:'Начинаю',some:'Есть ориентиры',confident:'Уверенно играю'})[v])}</select></div><div class="field"><label for="settings-minutes">Минут в день</label><select id="settings-minutes" data-setting="minutes">${options([5,8,15],state.minutes)}</select></div></div><button class="text-btn" data-go="onboarding">${ic('route','sm')}Пройти настройку и диагностику</button></section><section class="card"><h2>Отображение и звук</h2><div class="form-grid"><div class="field"><label for="notation">Названия нот</label><select id="notation" data-setting="notation">${options(['latin','ru'],state.notation,v=>v==='latin'?'C D E':'До Ре Ми')}</select></div><div class="field"><label for="accidentals">Знаки альтерации</label><select id="accidentals" data-setting="accidentals">${options(['sharp','flat'],state.accidentals,v=>v==='sharp'?'Диезы ♯':'Бемоли ♭')}</select></div></div><label class="checkbox-line"><input type="checkbox" data-setting="left" ${state.left?'checked':''}>Лады справа налево · для левши</label><label class="checkb function onboardingPage(){const titles=['Начнём с инструмента.','Что хочется уметь?','Найдём твой темп.'];const choices=onboardStep===0?Object.keys(instruments).map(v=>[v,instruments[v].short,instruments[v].names.slice().reverse().join(' — ')]):onboardStep===1?[['navigate','Знать, где каждая нота','Находить ориентиры и узнавать гриф без подсчёта.'],['harmony','Понимать, что я играю','Интервалы, трезвучия и аккордовые линии.'],['freedom','Играть свободнее','Соединять позиции, формы и музыкальные идеи.']]:[['new','Пока ищу ноты','Начнём с открытых струн и первой позиции.'],['some','Есть знакомые места','Соединим ориентиры и добавим гармонию.'],['confident','Хочу закрепить весь гриф','Верхние позиции, слух и перенос навыка.']];const key=['instrument','goal','level'][onboardStep];return `<div class="onboarding"><div class="onboarding-progress">${[0,1,2].map(i=>`<i class="${i<=onboardStep?'active':''}"></i>`).join('')}</div>${heading('Шаг '+(onboardStep+1)+' из 3',titles[onboardStep],'Всё это можно изменить позже в настройках.')}<div class="stack">${choices.map(([v,t,d])=>`<button class="choice-option ${state[key]===v?'selected':''}" data-action="onboard-choice" data-key="${key}" data-value="${v}"><div class="grow"><h3>${t}</h3><p>${d}</p></div>${state[key]===v?ic('check','sm'):ic('arrow','sm')}</button>`).join('')}</div>${onboardStep===2?`<label for="onboard-minutes" class="form-label" style="margin-top:22px">Сколько минут в день</label><div class="pill-switch full" id="onboard-minutes">${[5,8,15].map(m=>`<button data-action="onboard-minutes" data-value="${m}" class="${state.minutes===m?'active':''}">${m} минут</button>`).join('')}</div>`:''}<div class="row between" style="margin-top:26px"><button class="text-btn" data-action="onboard-back">${onboardStep?'Назад':'Позже'}</button><button class="btn" data-action="onboard-next">${onboardStep===2?'Короткая диагностика':'Дальше'} ${ic('arrow','sm')}</button></div>${onboardStep===2?'<button class="text-btn" style="margin:20px function metronomePage(){return `${heading('Практика в своём темпе','Ровно.<br><span class="serif">И ещё раз.</span>','Сильная доля звучит выше. При выходе метроном остановится.')}<section class="card metronome-panel"><span class="eyebrow muted">Ударов в минуту</span><div class="bpm-controls"><button data-action="bpm" data-delta="-1" aria-label="Уменьшить темп">−</button><strong class="bpm">${metro.bpm}</strong><button data-action="bpm" data-delta="1" aria-label="Увеличить темп">+</button></div><input type="range" min="40" max="200" value="${metro.bpm}" data-metro="bpm" aria-label="Темп метронома"><div class="form-grid"><div class="field"><label for="metro-beats">Размер</label><select id="metro-beats" data-metro="beats">${options([3,4],metro.beats,v=>v+'/4')}</select></div><div class="field"><label for="metro-subdivision">Деление доли</label><select id="metro-subdivision" data-metro="subdivision">${options([1,2],metro.subdivision,v=>v===1?'Четверти':'Восьмые')}</select></div></div><div class="beat-dots" aria-label="Доли такта">${Array.from({length:metro.beats},()=>'<i></i>').join('')}</div><button class="btn wide" data-action="metro-toggle">${ic(audio.metro||metroStarting?'close':'play','sm')}${audio.metro||metroStarting?'Остановить':'Запустить'}</button><button class="text-btn" data-action="tap-tempo" style="margin:19px auto 0;display:flex">Задать темп нажатиями</button><p class="small muted" style="margin-top:12px">Нажми несколько раз в нужном ритме.</p></section>`}
async function startMetro(){metroStarting=true;render();try{await audio.startMetronome({...metro,onBeat:i=>document.querySelectorAll('.beat-dots i').forEach((el,j)=>el.classList.toggle('active',i===j))})}catch{audio.stopMetronome();toast('Браузер не смог запустить звук. Попробуй нажать ещё раз.')}finally{metroStarting=false;if(screen==='metronome')render()}}
function updateMetro(k,v){const running=!!audio.metro;metro[k]=k==='bpm'?Math.max(40,Math.min(200,Math.round(v))):v;if(running)startMetro();else render()}
function micPanel(target=null,done=false){return `<div class="mic-box"><span class="eyebrow muted">${done?'Нота разобрана':target===null?'Хроматический тюнер':'Проверяем высоту звука'}</span>${target!==null?`<p class="mic-target" style="margin-top:10px">Цель: <strong>${fullNote(target)}</strong> · ${Math.round(440*2**((target-69)/12))} Гц</p>`:''}<div class="mic-note" id="mic-note">${done?fullNote(target):'—'}</div><div class="cents-meter" aria-hidden="true"><i id="cents-needle"></i></div><div class="tuner-labels"><span>−50 · ниже</span><span id="mic-cents">В центре — точная нота</span><span>+50 · выше</span></div>${!done?`<button class="btn ${audio.micActive||micPending?'secondary':''}" data-action="mic-toggle">${ic('mic','sm')}${micPending?'Отменить запрос':audio.micActive?'Выключить микрофон':'Включить микрофон'}</button>`:''}<p class="mic-message" id="mic-message" role="status">${esc(micMessage||'Сыграй одну струну, остальные приглуши. Микрофон включается по кнопке.')}</p><p class="small muted" style="font-size:10px">A4 = 440 Гц · звук обрабатывается на устройстве и не записывается</p></div>`}
function tunerPage(){return `${heading('Сначала настройся','Пусть звучит<br><span class="serif">чисто.</span>','Одноголосный тюнер для стандартного строя и любой отдельной ноты.')}<div class="metronome-panel">${micPanel()}<div class="card"><h3>Открытые струны · ${inst().short}</h3><p class="small muted" style="margin:12px 0">От толстой к тонкой. Нажми, чтобы услышать образец.</p><div class="row wrap" style="justify-content:center">${inst().tuning.slice().reverse().map(m=>`<button class="btn secondary compact" data-action="reference-note" data-midi="${m}">${fullNote(m)}</button>`).join('')}</div></div></div>`}
async function toggleMicrophone(){if(audio.micActive||micPending){audio.stopMic();micPending=false;micMessage='Микрофон выключен.';render();return}if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia){micMessage='Микрофон недоступен здесь. Открой HTTPS-версию приложения или локальный файл в браузере с поддержкой микрофона.';render();return}micPending=true;micStable={midi:null,at:0};micMessage='Разреши доступ к микрофону в запросе браузера. Можно отменить ожидание.';render();const screenAtStart=screen;try{const started=await audio.startMic(handlePitch);if(!started||screen!==screenAtStart)return;micPending=false;micMessage='Слушаю. Сыграй одну ноту и удерживай её.';render()}catch(error){micPending=false;const messages={NotAllowedError:'Доступ к микрофону запрещён. Разреши его в настройках этого сайта и попробуй снова.',NotFoundError:'Микрофон не найден. Подключи устройство и попробуй снова.',NotReadableError:'Микрофон занят или недоступен. Закрой другие приложения, использующие его.',SecurityError:'Браузер запретил микрофон на этой странице.'};micMessage=messages[error.name]||'Не удалось включить микрофон. Проверь устройство и разрешение браузера.';if(screen===screenAtStart)render()}}
function handlePitch(p){if(!audio.micActive)return;const n=$('#mic-note'),c=$('#mic-cents'),needle=$('#cents-needle'),msg=$('#mic-message');if(!n)return;if(!p||p.confidence<.85){micStable={midi:null,at:0};n.textContent='—';c.textContent='Жду устойчивый звук';return}n.textContent=fullNote(p.midi);c.textContent=(p.cents>0?'+':'')+Math.round(p.cents)+' центов';needle.style.left=(50+Math.max(-50,Math.min(50,p.cents)))+'%';n.style.color=Math.abs(p.cents)<=10?'var(--green)':'var(--ink)';if(screen!=='exercise'||!session||session.input!=='sound'||session.correct||session.skipped)return;if(Math.abs(p.cents)>35){micStable={midi:null,at:0};msg.textContent='Нота распознана, но звучит неточно. Попробуй настроить струну.';return}if(micStable.midi!==p.midi){micStable={midi:p.midi,at:performance.now()};return}const q=session.questions[session.index],target=q.targets[0].midi;if(performance.now()-micStable.at>=650){if(p.midi===target){micMessage='Нота и октава совпали.';submitAnswer(q.answer,{sound:true})}else{if(!session.hadError){session.hadError=true;persist()}msg.textContent=`Слышу ${fullNote(p.midi)}. Нужна ${fullNote(target)}. Попробуй ещё раз.`}}}
function setInstrument(v){if(!instruments[v])return;audio.stopAll();state.instrument=v;state.config.strings=inst().tuning.map((_,i)=>i);if(isBass()&&state.config.mode==='caged')state.config.mode='roots';explore.selected=null;if(['exercise','result'].includes(screen)){screen='home';history.replaceState(null,'','#home')}persist();render()}
function instrumentModal(){showModal('Выбери инструмент',`<p class="small muted" style="margin-bottom:17px">Стандартный строй. История и навыки сохраняются отдельно для каждого инструмента.</p><div class="stack">${Object.entries(instruments).map(([id,i])=>`<button class="choice-option ${state.instrument===id?'selected':''}" data-action="select-instrument" data-value="${id}"><div><h3>${i.short}</h3><p>${i.names.slice().reverse().join(' — ')}</p></div>${state.instrument===id?ic('check','sm'):ic('arrow','sm')}</button>`).join('')}</div>`)}
function download(data,name,type='application/json'){const url=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function exportProgress(){persist();download(JSON.stringify({app:'roots',version:2,exportedAt:new Date().toISOString(),state},null,2),'roots-progress-'+E.dayKey(new Date())+'.json');toast('Резервная копия подготовлена')}
function listenQuestion(){if(!session)return;const q=session.questions[session.index];let notes=q.mode==='ear'?q.sounds:q.sequence&&!q.pitchClass?q.sequence:q.anchor?[q.anchor.midi,q.targets[0].midi]:[q.targets[0].midi];audio.sequence(notes,85).catch(()=>toast('Не удалось воспроизвести звук'));micPending=false;micMessage='После образца включи микрофон снова.';if(session.input==='sound')render()}
function chooseMode(mode){state.config=defaultConfig(mode);persist();navigate('practice')}
function showHelp(){showModal('Как заниматься в ROOTS',`<p>Выбери инструмент и начни с «Маршрута» или настрой тренировку. Сверху на грифе — тонкая струна, 0 — открытая.</p><div class="learning-tip"><strong>Что считается уверенным ответом</strong><p>Верно с первой попытки, без подсказки и открытого ответа. В последовательностях нужно сыграть все звуки по порядку. Ошибка считается один раз на задание.</p></div><p>Слабые места возвращаются в повторение. Занятие можно закрыть и продолжить позже. Для переноса на другое устройство используй экспорт в настройках.</p><p style="margin-top:15px">Микрофон проверяет только одну ноту и октаву. Аккорды, струну и палец он не определяет. В тихой комнате, с приглушёнными соседними струнами, результат точнее.</p><button class="btn wide" data-action="close-modal" style="margin-top:23px">Понятно</button>`)}
document.addEventListener('click',async event=>{const b=event.target.closest('[data-action],[data-go]');if(!b||b.disabled)return;event.preventDefault();if(b.dataset.go){navigate(b.dataset.go);return}const a=b.dataset.action,v=b.dataset.value;
if(a==='close-modal')closeModal();
else if(a==='instrument')instrumentModal();
else if(a==='select-instrument'){closeModal();setInstrument(v);if(screen==='home')history.replaceState(null,'','#home')}
else if(a==='switch-guitar'){setInstrument('guitar');navigate('caged')}
else if(a==='help')showHelp();
else if(a==='daily')startDaily();
else if(a==='resume')resume();
else if(a==='replace-session'){const fn=pendingNavigation;pendingNavigation=null;closeModal();if(fn)fn()}
else if(a==='choose-mode')chooseMode(b.dataset.mode);
else if(a==='config-mode'){state.config={...config(),mode:b.dataset.mode};if(!SOUNDMODES.includes(b.dataset.mode))state.config.input='screen';if(b.dataset.mode==='triad'&&!['major','minor'].includes(state.config.quality))state.config.quality='major';persist();render()}
else if(a==='config-string'){const s=+b.dataset.string,c=config();state.config.strings=c.strings.includes(s)?c.strings.filter(x=>x!==s):[...c.strings,s].sort((a,b)=>a-b);persist();render()}
else if(a==='input-mode'){state.config.input=v;persist();render()}
else if(a==='theory'){const m=E.MODES[b.dataset.mode];showModal(m.name,`<p>${m.theory}</p><div class="learning-tip">${m.desc}</div><button class="btn wide" data-action="close-modal">К практике</button>`)}
else if(a==='start-config')startConfig();
else if(a==='lesson')lessonModal(b.dataset.id);
else if(a==='start-lesson'){const l=lessons().flatMap(g=>g.items).find(l=>l.id===b.dataset.id);if(l){closeModal();begin(E.generate({...defaultConfig(l.mode),...l.config},statsFor()),{label:l.title,mode:l.mode,lessonId:l.id})}}
else if(a==='review')startReview(false,b.dataset.input||'screen');
else if(a==='repeat-result'){const ids=new Set(lastResult.answers.filter(a=>!a.first).map(a=>a.questionId));const qs=currentCards(lastResult.input).filter(([,c])=>ids.has(c.question.id)).map(([,c])=>({...c.question,positions:E.positions(c.question)}));begin(qs,{label:'Повторение ошибок',mode:'review',input:lastResult.input})}
else if(a==='board-answer')submitAnswer(b.dataset.key);
else if(a==='choice-answer')submitAnswer(+v);
else if(a==='next-question'){micMessage='';nextQuestion()}
else if(a==='hint'&&session){session.hint=true;persist();render()}
else if(a==='show-answer'&&session){audio.stopAll();micPending=false;session.skipped=true;persist();render()}
else if(a==='listen-question')listenQuestion();
else if(a==='board-sound'){const [s,f]=b.dataset.key.split(':').map(Number);if(screen==='fretboard'){explore.selected={s,f};explore.root=pc(inst().tuning[s]+f)}play(inst().tuning[s]+f);render()}
else if(a==='play-selected'){if(explore.selected)play(inst().tuning[explore.selected.s]+explore.selected.f,.6,true);else toast('Сначала выбери ноту на грифе')}
else if(a==='explore-label'){explore.labels=v;render()}
else if(a==='practice-area'){state.config={...defaultConfig('find'),min:explore.min,max:explore.max,root:explore.type==='notes'?'any':explore.root,naturals:false};persist();navigate('practice')}
else if(a==='practice-cell'){state.config={...defaultConfig('name'),min:+b.dataset.fret,max:+b.dataset.fret,strings:[+b.dataset.string],count:5,naturals:false};startConfig()}
else if(a==='shape'){caged.shape=b.dataset.shape;render()}
else if(a==='caged-root'){caged.root=+v;render()}
else if(a==='caged-label'){caged.labels=v;render()}
else if(a==='caged-play')audio.sequence(E.voicing(caged.shape,caged.root).map(p=>p.midi).sort((a,b)=>a-b),105).catch(()=>toast('Не удалось включить звук'));
else if(a==='practice-caged'){state.config={...defaultConfig('caged'),shape:caged.shape,root:caged.root,max:24};startConfig()}
else if(a==='progress-input'){progressInput=v;render()}
else if(a==='onboard-choice'){if(b.dataset.key==='instrument')setInstrument(v);else state[b.dataset.key]=v;persist();render()}
else if(a==='onboard-minutes'){state.minutes=+v;persist();render()}
else if(a==='onboard-back'){if(onboardStep){onboardStep--;render()}else navigate('home')}
else if(a==='onboard-next'){if(onboardStep<2){onboardStep++;render();window.scrollTo(0,0)}else startDaily(true)}
else if(a==='skip-diagnostic'){state.onboarded=true;persist();navigate('home')}
else if(a==='bpm')updateMetro('bpm',metro.bpm+(+b.dataset.delta));
else if(a==='metro-toggle'){if(audio.metro||metroStarting){audio.stopMetronome();metroStarting=false;render()}else await startMetro()}
else if(a==='tap-tempo'){const now=performance.now();if(taps.length&&now-taps.at(-1)>2200)taps=[];taps.push(now);taps=taps.slice(-5);if(taps.length>1)updateMetro('bpm',60000/((taps.at(-1)-taps[0])/(taps.length-1)));else toast('Продолжай нажимать в нужном ритме')}
else if(a==='mic-toggle')await toggleMicrophone();
else if(a==='reference-note'){audio.stopMic();micPending=false;micMessage='После образца включи микрофон снова.';play(+b.dataset.midi,1,true);render()}
else if(a==='export')exportProgress();
else if(a==='export-raw')download(rawStored||'','roots-original-data.json');
else if(a==='import')$('#import-file').click();
else if(a==='apply-import'&&pendingImport){const next=pendingImport;closeModal();audio.stopAll();state=next;session=state.active;storageLocked=false;lastResult=null;persist();navigate('home');toast('Резервная копия восстановлена')}
else if(a==='reset')showModal('Сбросить весь прогресс?',`<p>История, повторения и незавершённое занятие будут удалены. Это действие нельзя отменить без резервной копии.</p><div class="stack" style="margin-top:20px"><button class="btn secondary" data-action="export">Сначала экспортировать</button><button class="btn danger-btn" data-action="confirm-reset">Удалить прогресс</button><button class="text-btn" data-action="close-modal">Отмена</button></div>`);
else if(a==='confirm-reset'){closeModal();audio.stopAll();state=E.newState();session=null;lastResult=null;storageLocked=false;persist();navigate('home');toast('Прогресс сброшен')}
});
document.addEventListener('change',event=>{const el=event.target,k=el.dataset.config;if(k){let v=el.type==='checkbox'?el.checked:el.value;if(['min','max','count'].includes(k))v=+v;state.config[k]=v;if(k==='min'&&v>state.config.max)state.config.max=v;if(k==='max'&&v<state.config.min)state.config.min=v;persist();render()}const setting=el.dataset.setting;if(setting){if(setting==='instrument')setInstrument(el.value);else{state[setting]=el.type==='checkbox'?el.checked:setting==='minutes'?+el.value:el.value;persist();render()}}if(el.dataset.explore){const k=el.dataset.explore;if(k==='range'){[explore.min,explore.max]=el.value.split('-').map(Number);explore.selected=null}else{explore[k]=k==='root'?+el.value:el.value;if(k==='root')explore.selected=null}render()}if(el.dataset.metro)updateMetro(el.dataset.metro,+el.value)});
$('#import-file').addEventListener('change',async event=>{const f=event.target.files[0];event.target.value='';if(!f)return;try{if(f.size>12*1024*1024)throw Error('Файл больше 12 МБ');const next=E.validateImport(JSON.parse(await f.text()));showModal('Восстановить резервную копию?',`<p>В файле: занятий — ${next.sessions.length}, карточек — ${Object.keys(next.cards).length}. ${next.active?'Незавершённое занятие тоже восстановится.':''}</p><p style="margin-top:15px">Текущий прогресс будет заменён содержимым файла.</p><div class="stack" style="margin-top:20px"><button class="btn secondary" data-action="export">Сохранить текущую копию</button><button class="btn" data-action="apply-import">Восстановить из файла</button><button class="text-btn" data-action="close-modal">Отмена</button></div>`);pendingImport=next}catch(error){showModal('Не удалось прочитать копию',`<p>${esc(error.message)}</p><p style="margin-top:14px">Текущий прогресс сохранён без изменений.</p><button class="btn wide" data-action="close-modal" style="margin-top:20px">Понятно</button>`)}});
$('#modal').addEventListener('cancel',()=>{pendingImport=null;audio.stopMic();micPending=false});
let lastTick=performance.now(),saveTick=0;
setInterval(()=>{const now=performance.now(),elapsed=Math.min(2,(now-lastTick)/1000);lastTick=now;if(!document.hidden&&screen==='exercise'&&session&&!session.finished&&!$('#modal').open&&!session.correct&&!session.skipped){session.activeSeconds+=elapsed;session.questionSeconds+=elapsed;const el=$('#session-time');if(el)el.textContent=seconds(session.activeSeconds);if(++saveTick%5===0)persist()}},1000);
document.addEventListener('visibilitychange',()=>{lastTick=performance.now();if(document.hidden){audio.stopAll();micPending=false;metroStarting=false;persist()}else if(['tuner','metronome','exercise'].includes(screen)){micMessage='Микрофон остановлен. Включи его снова, когда будешь готов.';render()}});
window.addEventListener('pagehide',()=>{audio.stopAll();persist()});
render();
</script></body></html>
